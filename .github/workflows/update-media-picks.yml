name: Monthly Movie & Series Picks Refresh (Zero-Cost)

on:
  schedule:
    # Runs automatically at 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allows manual 1-click trigger in GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  refresh-media-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest releases & update js/media_picks.js
        run: node scripts/update_media_picks.js

      - name: Verify JS syntax before committing
        run: node --check js/media_picks.js

      - name: Commit & push if updated
        run: |
          git config user.name "Agreesy Auto-Curator"
          git config user.email "actions@github.com"
          if [[ -n $(git status --porcelain js/media_picks.js) ]]; then
            git add js/media_picks.js
            git commit -m "chore(media): automated monthly movie & series picks refresh"
            git push
          else
            echo "No changes to commit."
          fi

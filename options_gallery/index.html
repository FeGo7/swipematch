<html lang="de" class="dark">
<head>

    <title>Agreesy – Microsoft Fluent 3D Optionen-Galerie</title>
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#E05A3A',
                        brandGreen: '#16A34A',
                        darkBg: '#0B0F17',
                        darkSurface: '#121927',
                        darkCard: '#172235',
                        darkBorder: '#223048'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0B0F17;
            color: #F1F5F9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card-glow {
            transition: all 0.25s ease-out;
        }
        .card-glow:hover {
            transform: translateY(-4px);
            border-color: #E05A3A;
            box-shadow: 0 12px 30px -10px rgba(224, 90, 58, 0.25);
        }
        .image-container {
            background: radial-gradient(circle, rgba(224,90,58,0.12) 0%, rgba(23,34,53,0) 70%);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->

            <div>
                <div class="flex items-center gap-2.5 mb-2">
                    <span class="w-3 h-3 rounded-full bg-brand"></span>
                    <span class="text-xs uppercase tracking-widest text-brand font-semibold">Agreesy Visual Design System</span>
                </div>
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white mb-2">
                    Microsoft Fluent 3D Optionen-Galerie
                </h1>
                <p class="text-sm md:text-base text-slate-400">
                    Alle <strong>198 Entscheidungs-Optionen</strong> über <strong>17 Decks</strong> im Überblick – mit echten plastischen 3D-Rendern.
                </p>
            </div>
            <div class="flex items-center gap-3">
                <a href="../index.html" class="px-4 py-2 rounded-xl text-xs font-medium bg-darkSurface hover:bg-darkCard border border-darkBorder text-slate-300 transition">
                    ← Zurück zur App
                </a>
            </div>
        </header>

        <!-- Controls (Search & Deck Filters) -->
        <div class="mb-8 space-y-4">
            <!-- Search Input -->
            <div class="relative">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="🔍 Suche nach Gericht, Film, Aktivität, Deck oder Emoji (z.B. Pasta, Pizza, Netflix, Wäsche, 🍕)..." 
                    class="w-full px-4 py-3 rounded-xl bg-darkSurface border border-darkBorder text-white text-sm focus:outline-none focus:border-brand transition shadow-inner"
                    oninput="filterCards()"
                >
            </div>

            <!-- Deck Filter Chips -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none flex-wrap" id="deck-chips">
                <button onclick="selectDeck('all')" id="chip-all" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-brand text-white shadow-sm transition whitespace-nowrap">
                    Alle Decks (198)
                </button>
            </div>
        </div>

        <!-- Counter info -->
        <div class="flex items-center justify-between text-xs text-slate-400 mb-6">
            <span id="results-count">Zeige 198 von 198 Karten</span>
            <span class="text-slate-500">Alle Bilder liegen lokal im Ordner <code>options_gallery/images/</code></span>
        </div>

        <!-- Cards Grid -->
        <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        </div>
    </div>

        let activeDeck = 'all';

        // Render Deck Chips
        const chipsContainer = document.getElementById('deck-chips');
        DECKS.forEach(deck => {
            const btn = document.createElement('button');
            btn.id = `chip-${deck.id}`;
            btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-darkSurface hover:bg-darkCard border border-darkBorder text-slate-300 transition whitespace-nowrap";
            btn.innerText = `${deck.title} (${deck.count})`;
            btn.onclick = () => selectDeck(deck.id);
            chipsContainer.appendChild(btn);
        });

        function selectDeck(deckId) {
            activeDeck = deckId;
            document.querySelectorAll('#deck-chips button').forEach(b => {
                b.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-darkSurface hover:bg-darkCard border border-darkBorder text-slate-300 transition whitespace-nowrap";
            });
            const activeBtn = document.getElementById(`chip-${deckId}`);
            if (activeBtn) {
                activeBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium bg-brand text-white shadow-sm transition whitespace-nowrap";
            }
            filterCards();
        }

        function filterCards() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            const filtered = CARDS.filter(c => {
                if (activeDeck !== 'all' && c.deckId !== activeDeck) return false;
                if (!q) return true;
                return (
                    c.titleDe.toLowerCase().includes(q) ||
                    c.titleEn.toLowerCase().includes(q) ||
                    c.deckTitle.toLowerCase().includes(q) ||
                    c.emoji.includes(q) ||
                    c.imageFile.toLowerCase().includes(q)
                );
            });

            document.getElementById('results-count').innerText = `Zeige ${filtered.length} von ${CARDS.length} Karten`;

            filtered.forEach(c => {
                const card = document.createElement('div');
                card.className = "bg-darkCard border border-darkBorder rounded-2xl p-5 flex flex-col justify-between card-glow relative overflow-hidden";
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs mb-3">
                        <span class="px-2 py-0.5 rounded-md bg-darkSurface text-slate-400 font-medium truncate max-w-[170px]" title="${c.deckTitle}">
                            ${c.deckTitle}
                        </span>
                        <div class="flex items-center gap-1.5">
                            <span class="w-6 h-6 rounded-md bg-darkSurface flex items-center justify-center text-sm" title="Original-Emoji">
                                ${c.emoji}
                            </span>
                            <span class="font-mono text-slate-500 text-[11px]">#${String(c.cardId).padStart(2, '0')}</span>
                        </div>
                    </div>

                    <div class="image-container w-full h-32 rounded-xl flex items-center justify-center my-2 p-2">
                        <img 
                            src="images/${c.imageFile}" 
                            alt="${c.titleDe}" 
                            class="max-w-[88px] max-h-[88px] object-contain drop-shadow-[0_8px_16px_rgba(0,0,0,0.4)]"
                            loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                        >
                        <span class="text-5xl hidden">${c.emoji}</span>
                    </div>

                    <div class="mt-2 text-center">
                        <h3 class="text-sm font-semibold text-white leading-snug mb-1">
                            ${c.titleDe}
                        </h3>
                        <p class="text-xs text-slate-400 leading-tight mb-3">
                            ${c.titleEn}
                        </p>
                        <div class="pt-2 border-t border-darkBorder/60 flex items-center justify-center">
                            <a href="images/${c.imageFile}" target="_blank" class="font-mono text-[10px] text-slate-400 hover:text-brand transition flex items-center gap-1 truncate max-w-full" title="Klicke, um die Bilddatei direkt zu öffnen">
                                <span>🖼️</span> <span class="truncate">${c.imageFile}</span>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Initial render
        filterCards();
    </script>
